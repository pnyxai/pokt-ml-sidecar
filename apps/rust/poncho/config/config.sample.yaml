# Set the loglevel (debug/info/error)
log_level: "debug"

# Which engine this sidecar fronts. Only the endpoints for this role are
# exposed; every other /v1 path or method returns 404.
# This block and `role` are mandatory: the sidecar fails to start without them.
engine:
  # Required. One of: chat, embedding, reranker
  role: chat
  # Legacy /v1/completions is only exposed when explicitly enabled here
  serve_completions: false

# Multimodal media policy. Keep limit_mm_per_prompt in sync with the engine's
# --limit-mm-per-prompt value. Media is rejected by default until configured.
# The whole block is mandatory when `engine.role` is `chat`; the sidecar
# fails to start without it. It may be omitted for other roles.
media:
  # Whether video_url content parts are accepted
  allow_video: false
  # Maximum media items per request for each modality
  limit_mm_per_prompt:
    image: 0
    audio: 0
    video: 0
  # Maximum decoded bytes per media item
  max_item_bytes:
    image: 5242880
    audio: 5242880
    video: 5242880
  # Maximum image dimensions in pixels
  max_image_width: 8192
  max_image_height: 8192
  # Maximum audio duration in seconds
  max_audio_duration_seconds: 600

# Configuration of the poncho server
server:
  # Use 0.0.0.0 to expose the poncho app
  host: "0.0.0.0" 
  # Port to use for poncho
  port: 8080

# The configuration of you vLLM backend to cover
vllm_backend:
  # Where the vLLM is deployed
  host: "http://127.0.0.1"
  port: 8000
  # The name of the model that is being served in vLLM
  model_name_override: "meta-llama/Llama-3.1-8B-Instruct"
  # Wheter to allow the users requesting through poncho to get logprobs
  allow_logprobs: false
  # If `true` the poncho will edit the `max_tokens` or `max_completion_tokens` 
  # field of the incoming request to limit the amount requested and allow the 
  # request to proceed to the vLLM backend. 
  # So, if the `model_config_data.max_position_embeddings` is set to 4096 and
  # a request comes with a field `max_tokens : 16000`, the poncho will edit this
  # field and allow the request to pass with:
  # `max_completion_tokens : model_config_data.max_position_embeddings - inputTokens`
  # (if set to false it will simply reject any request with more than `max_position_embeddings` tokens requested)
  crop_max_tokens: true
  # Optional: maximum number of texts allowed in a single /v1/embeddings request
  # max_batched_texts_embedding: 100
  # Optional: maximum number of documents allowed in a single /v1/rerank request
  # max_rerank_documents: 50

# This configures the request routing
routing:
  # Timeout for the backend
  timeout_seconds: 600
  # Max payload to accept/transmit
  max_payload_size_mb: 10

# This configures how the model will be publicized by the Poncho
model_config_data:
  # Name to show to the public (and used to override model name in responses)
  model_public_name : "pocket_network"
  # Maximum number of tokens for requests coming though Poncho
  max_position_embeddings : 4096
  # Maximum number of tokens to generate (should be lower than max_position_embeddings)
  max_tokens: 4095